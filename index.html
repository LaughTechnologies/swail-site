<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Swail</title>
<meta name="description" content="Swail — an ocean of email, cleaned up in minutes.">
<style>
  :root { --bg: #F4F8F8; --ink: #12302F; --ink2: #4A6463; --primary: #0A736E; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0E1716; --ink: #E6F2F1; --ink2: #9DB5B3; --primary: #3CC8BF; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
         font: 17px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 0 16px; }
  main { max-width: 32rem; text-align: center; }
  h1 { font-size: 1rem; letter-spacing: .08em; text-transform: uppercase; color: var(--primary); margin: 0 0 .5rem; }
  p.headline { font-size: 2.5rem; font-weight: 700; line-height: 1.1; margin: 0 0 .75rem; }
  p { color: var(--ink2); margin: 0; }
  footer { margin-top: 2.5rem; font-size: .85rem; color: var(--ink2); }
</style>
</head>
<body>
<main>
  <h1>Swail</h1>
  <p class="headline">Swipe. Gulp. Gone.</p>
  <p>An ocean of email, cleaned up in minutes.</p>
  <footer>© Laugh Technologies Ltd</footer>
</main>
</body>
</html>
